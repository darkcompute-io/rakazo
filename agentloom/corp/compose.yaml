      SANDBOX_COMMAND_TIMEOUT_MS: '300000'
      SANDBOX_SUPERVISOR_TOKEN: ${SANDBOX_SUPERVISOR_TOKEN}
      SANDBOX_SCREEN_NETWORK: isolated
      SANDBOX_COMPUTER_EGRESS: auto
      LOG_LEVEL: info
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - appdata:/data
    networks:
    - app
    depends_on:
      computer:
        condition: service_completed_successfully
      data-init:
        condition: service_completed_successfully
    healthcheck:
      test:
