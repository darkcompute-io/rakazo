      AGENTLOOM_MCP_CLIENT_ID: ${AGENTLOOM_MCP_CLIENT_ID}
      AGENTLOOM_MCP_CLIENT_SECRET: ${AGENTLOOM_MCP_CLIENT_SECRET}
      AGENTLOOM_REGISTRY_AUTO: '1'
    volumes:
    - appdata:/data
    networks:
    - app
    - data
    depends_on:
      postgres:
        condition: service_healthy
      data-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      supervisor:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 20
    pull_policy: always
  worker:
    image: 127.0.0.1:5000/agentloom-app:agentloom
    restart: unless-stopped
    working_dir: /app/apps/worker
    command:
    - node
    - --enable-source-maps
    - dist/index.js
    healthcheck:
      test:
      - CMD
      - node
      - dist/health-check.js
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 2m
    init: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    pids_limit: 512
    mem_limit: 2g
    extra_hosts:
    - host.docker.internal:host-gateway
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://rakazo_app:${POSTGRES_APP_PASSWORD}@postgres:5432/rakazo
      DATA_DIR: /data
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CONTENT_ENCRYPTION: 'on'
      WAKEUP_DRIVER: graphile
      AGENT_RUNTIME: pi
      API_URL: https://agentloom.corp.darkcompute.io
      SECRET_STORE: encrypted
      INFISICAL_ALLOW_INSECURE_HTTP: 'false'
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      RAKAZO_AUTO_REVIEW_TIMEOUT_MS: '30000'
      SANDBOX_PROVIDER: docker
      SANDBOX_SUPERVISOR_URL: http://supervisor:7091
      SANDBOX_SUPERVISOR_TOKEN: ${SANDBOX_SUPERVISOR_TOKEN}
      CLOUD_AGENT_PROVIDER: none
      PAYMENT_WALLET_PROVIDER: none
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY}
