# AgentLoom for darkcompute, published at https://agentloom.corp.darkcompute.io by corp-caddy, which
# proxies to this host's :80 (web, which same-origin-proxies /api and /rpc to api).
# Who gets in is authentik's decision: application AgentLoom (slug
# darkcompute-rakazo) and its binding. There is no password sign-in, and an
# account opens for whoever authentik sends back (OIDC_ALLOW_SIGNUP_BYPASS).
# watch-init, watch and watch-proxy are agentloom-watch (corp/watch): every routine
# on one page with a Stop, behind oauth2-proxy on :8091.
#
# Nothing is built here. The plane's local runner (agentloom/runner) builds upstream's
# infra/compose/Dockerfile and agentloom/Dockerfile from the agentloom branch and pushes
# the image to the registry on this host; api, worker, web and the supervisor all run it.
#
# Generated by agentloom/gen-compose.py from infra/compose/docker-compose.images.yml
# (upstream v0.3.6). Regenerate after every merge from upstream; never hand-edit.
name: rakazo
services:
  postgres:
    image: postgres:16@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    pids_limit: 200
    mem_limit: 2g
    environment:
      POSTGRES_USER: rakazo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rakazo
    volumes:
    - pgdata:/var/lib/postgresql/data
    networks:
    - data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U rakazo -d rakazo
      interval: 5s
      timeout: 5s
      retries: 20
  computer:
    image: ghcr.io/elie222/rakazo/computer:v0.3.6
    command:
    - 'true'
    network_mode: none
    restart: 'no'
  data-init:
    image: busybox:1
    command:
    - chown
    - -R
    - 1000:1000
    - /data
    network_mode: none
    restart: 'no'
    volumes:
    - appdata:/data
  supervisor:
    image: 127.0.0.1:5000/agentloom-app:agentloom
    restart: unless-stopped
    command:
    - pnpm
    - --filter
    - '@rakazo/sandbox-supervisor'
    - start
    init: true
    user: root
    security_opt:
    - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    environment:
      MAX_UPLOAD_SIZE_MB: '10'
      NODE_ENV: production
      DATA_DIR: /data
      SUPERVISOR_HOST: 0.0.0.0
      SUPERVISOR_PORT: '7091'
      DOCKER_SOCKET: /var/run/docker.sock
      RAKAZO_COMPUTER_IMAGE: ghcr.io/elie222/rakazo/computer:v0.3.6
      RAKAZO_COMPUTER_MEMORY: 2g
      RAKAZO_COMPUTER_CPUS: '2'
      RAKAZO_COMPUTER_PIDS_LIMIT: '2048'
      SANDBOX_COMMAND_TIMEOUT_MS: '300000'
      SANDBOX_SUPERVISOR_TOKEN: ${SANDBOX_SUPERVISOR_TOKEN}
      SANDBOX_SCREEN_NETWORK: isolated
      SANDBOX_COMPUTER_EGRESS: auto
      LOG_LEVEL: info
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - appdata:/data
    networks:
    - app
    depends_on:
      computer:
        condition: service_completed_successfully
      data-init:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:7091/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 20
    pull_policy: always
  migrate:
    image: 127.0.0.1:5000/agentloom-app:agentloom
    working_dir: /app/apps/api
    command:
    - pnpm
    - db:deploy
    restart: 'no'
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    pids_limit: 256
    mem_limit: 1536m
    environment:
      DATABASE_URL: postgres://rakazo_app:${POSTGRES_APP_PASSWORD}@postgres:5432/rakazo
      DATABASE_MIGRATION_URL: postgres://rakazo:${POSTGRES_PASSWORD}@postgres:5432/rakazo
    networks:
    - data
    depends_on:
      postgres:
        condition: service_healthy
    pull_policy: always
  api:
    image: 127.0.0.1:5000/agentloom-app:agentloom
    restart: unless-stopped
    working_dir: /app/apps/api
    command:
    - node
    - --enable-source-maps
    - dist/index.js
    init: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    pids_limit: 256
    mem_limit: 1536m
    extra_hosts:
    - host.docker.internal:host-gateway
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://rakazo_app:${POSTGRES_APP_PASSWORD}@postgres:5432/rakazo
      DATA_DIR: /data
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CONTENT_ENCRYPTION: 'on'
      WAKEUP_DRIVER: graphile
      AGENT_RUNTIME: pi
      API_URL: https://agentloom.corp.darkcompute.io
      SECRET_STORE: encrypted
      INFISICAL_ALLOW_INSECURE_HTTP: 'false'
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      SANDBOX_PROVIDER: docker
      SANDBOX_SUPERVISOR_URL: http://supervisor:7091
      SANDBOX_SUPERVISOR_TOKEN: ${SANDBOX_SUPERVISOR_TOKEN}
      CLOUD_AGENT_PROVIDER: none
      PAYMENT_WALLET_PROVIDER: none
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY}
      API_HOST: 0.0.0.0
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: https://agentloom.corp.darkcompute.io
      WEB_ORIGIN: https://agentloom.corp.darkcompute.io
      AUTH_PASSWORD_ENABLED: 'false'
      AUTH_BREACHED_PASSWORD_CHECK_ENABLED: 'false'
      TRUSTED_PROXIES: local-networks,10.56.30.243
      OIDC_ISSUER: https://auth.darkcompute.io/application/o/darkcompute-rakazo/
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_NAME: authentik
      OIDC_SCOPES: openid email profile
      OIDC_ALLOW_SIGNUP_BYPASS: 'true'
      SIGNUPS_ENABLED: 'true'
      SCREEN_PROXY_SECRET: ${SCREEN_PROXY_SECRET}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER}
      EMAIL_API_KEY: ${EMAIL_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      GITEA_URL: http://gitea:3000
      GITEA_ADMIN_USER: agentloom
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD}
      GITEA_MCP_URL: http://gitea-mcp:8080/mcp
      AGENTLOOM_PRIVATE_MCP_ORIGINS: http://gitea-mcp:8080,https://agents.corp.darkcompute.io,https://tasks.corp.darkcompute.io
      AGENTLOOM_REGISTRY: '[{"id":"projects","name":"Projects","auth":"projects","description":"This space''s
        folders, where bots keep documents, files, status and a log."},{"id":"tasks","name":"Tasks","auth":"person","endpoint":"https://tasks.corp.darkcompute.io/api/mcp","open":"https://tasks.corp.darkcompute.io","description":"The
        team''s tasks, triage and goals, as you."}]'
      AGENTLOOM_MCP_CLIENT_ID: ${AGENTLOOM_MCP_CLIENT_ID}
      AGENTLOOM_MCP_CLIENT_SECRET: ${AGENTLOOM_MCP_CLIENT_SECRET}
    volumes:
    - appdata:/data
    networks:
    - app
    - data
    depends_on:
      postgres:
        condition: service_healthy
      data-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      supervisor:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 20
    pull_policy: always
  worker:
    image: 127.0.0.1:5000/agentloom-app:agentloom
    restart: unless-stopped
    working_dir: /app/apps/worker
    command:
    - node
    - --enable-source-maps
    - dist/index.js
    healthcheck:
      test:
      - CMD
      - node
      - dist/health-check.js
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 2m
    init: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    pids_limit: 512
    mem_limit: 2g
    extra_hosts:
    - host.docker.internal:host-gateway
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://rakazo_app:${POSTGRES_APP_PASSWORD}@postgres:5432/rakazo
      DATA_DIR: /data
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CONTENT_ENCRYPTION: 'on'
      WAKEUP_DRIVER: graphile
      AGENT_RUNTIME: pi
      API_URL: https://agentloom.corp.darkcompute.io
      SECRET_STORE: encrypted
      INFISICAL_ALLOW_INSECURE_HTTP: 'false'
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      SANDBOX_PROVIDER: docker
      SANDBOX_SUPERVISOR_URL: http://supervisor:7091
      SANDBOX_SUPERVISOR_TOKEN: ${SANDBOX_SUPERVISOR_TOKEN}
      CLOUD_AGENT_PROVIDER: none
      PAYMENT_WALLET_PROVIDER: none
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY}
      GITEA_URL: http://gitea:3000
      GITEA_ADMIN_USER: agentloom
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD}
      GITEA_MCP_URL: http://gitea-mcp:8080/mcp
      AGENTLOOM_PRIVATE_MCP_ORIGINS: http://gitea-mcp:8080,https://agents.corp.darkcompute.io,https://tasks.corp.darkcompute.io
      AGENTLOOM_REGISTRY: '[{"id":"projects","name":"Projects","auth":"projects","description":"This space''s
        folders, where bots keep documents, files, status and a log."},{"id":"tasks","name":"Tasks","auth":"person","endpoint":"https://tasks.corp.darkcompute.io/api/mcp","open":"https://tasks.corp.darkcompute.io","description":"The
        team''s tasks, triage and goals, as you."}]'
    volumes:
    - appdata:/data
    networks:
    - app
    - data
    depends_on:
      postgres:
        condition: service_healthy
      data-init:
        condition: service_completed_successfully
      supervisor:
        condition: service_healthy
      api:
        condition: service_healthy
    pull_policy: always
  web:
    image: 127.0.0.1:5000/agentloom-app:agentloom
    restart: unless-stopped
    working_dir: /app/apps/web
    command:
    - node_modules/.bin/vite
    - preview
    - --host
    - 0.0.0.0
    - --port
    - '5173'
    volumes:
    - webassets:/app/apps/web/asset-archive
    init: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    pids_limit: 128
    mem_limit: 512m
    environment:
      NODE_ENV: production
      RAYON_NUM_THREADS: '4'
      API_PROXY_TARGET: http://api:3100
      RAKAZO_HOST: agentloom.corp.darkcompute.io
      RAKAZO_IMAGE_TAG: v0.3.6
      SCREEN_PROXY_SECRET: ${SCREEN_PROXY_SECRET}
      RAKAZO_CSP_SCRIPT_SRC: https://a.darkcompute.io
      RAKAZO_CSP_CONNECT_SRC: https://a.darkcompute.io
    networks:
    - app
    depends_on:
      api:
        condition: service_healthy
    pull_policy: always
    ports:
    - 80:5173
  gitea:
    image: docker.gitea.com/gitea:1.24.6-rootless@sha256:91f2b27e080739f0d19dba716c3214f17257c632cf762e545b44ca577e37052c
    restart: unless-stopped
    environment:
      GITEA__security__INSTALL_LOCK: 'true'
      GITEA__service__DISABLE_REGISTRATION: 'true'
      GITEA__service__REQUIRE_SIGNIN_VIEW: 'true'
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: http://gitea:3000/
      GITEA__server__OFFLINE_MODE: 'true'
      GITEA__repository__DEFAULT_PRIVATE: private
      GITEA__repository__DISABLE_MIGRATIONS: 'true'
      GITEA__mirror__ENABLED: 'false'
      GITEA__webhook__ALLOWED_HOST_LIST: loopback
    volumes: &id001
    - giteadata:/var/lib/gitea
    - giteaconfig:/etc/gitea
    networks:
    - data
  gitea-init:
    image: docker.gitea.com/gitea:1.24.6-rootless@sha256:91f2b27e080739f0d19dba716c3214f17257c632cf762e545b44ca577e37052c
    restart: 'no'
    environment:
      GITEA__security__INSTALL_LOCK: 'true'
      GITEA__service__DISABLE_REGISTRATION: 'true'
      GITEA__service__REQUIRE_SIGNIN_VIEW: 'true'
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: http://gitea:3000/
      GITEA__server__OFFLINE_MODE: 'true'
      GITEA__repository__DEFAULT_PRIVATE: private
      GITEA__repository__DISABLE_MIGRATIONS: 'true'
      GITEA__mirror__ENABLED: 'false'
      GITEA__webhook__ALLOWED_HOST_LIST: loopback
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD}
    volumes: *id001
    networks:
    - data
    depends_on:
    - gitea
    entrypoint:
    - /bin/sh
    - -c
    command:
    - for i in $$(seq 60); do gitea admin user list >/dev/null 2>&1 && break; sleep 2; done; gitea admin
      user list | grep -qw agentloom || gitea admin user create --admin --username agentloom --email admin@agentloom.local
      --password "$$GITEA_ADMIN_PASSWORD" --must-change-password=false
  gitea-mcp:
    image: docker.gitea.com/gitea-mcp-server@sha256:ccdb5660ecdf54c5e480f10cc8120ba2bf150b582cea8a1974de2e59883582d3
    restart: unless-stopped
    command:
    - /app/gitea-mcp
    - -t
    - http
    - --port
    - '8080'
    - -H
    - http://gitea:3000
    environment:
      GITEA_TOOLS: create_repo,list_my_repos,get_repository_tree,get_file_contents,get_dir_contents,create_or_update_file,list_commits
    networks:
    - data
    depends_on:
    - gitea
  watch-init:
    image: agentloom-watch:local
    build:
      context: ./watch
    pull_policy: build
    command:
    - python3
    - /app/watch.py
    - init
    restart: 'no'
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      WATCH_DB_PASSWORD: ${WATCH_DB_PASSWORD}
    networks:
    - data
    depends_on:
      api:
        condition: service_healthy
  watch:
    image: agentloom-watch:local
    build:
      context: ./watch
    pull_policy: build
    restart: unless-stopped
    read_only: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    mem_limit: 128m
    environment:
      WATCH_DB_PASSWORD: ${WATCH_DB_PASSWORD}
      WATCH_ORIGIN: https://agentloom-watch.corp.darkcompute.io
      TRUSTED_PROXY: 10.231.70.10
    volumes:
    - watchdata:/data
    networks:
      data: {}
      watch:
        ipv4_address: 10.231.70.20
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      watch-init:
        condition: service_completed_successfully
  watch-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0
    restart: unless-stopped
    ports:
    - 8091:4180
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_PROVIDER_DISPLAY_NAME: authentik
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://auth.darkcompute.io/application/o/darkcompute-agentloom-watch/
      OAUTH2_PROXY_CLIENT_ID: ${WATCH_OIDC_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${WATCH_OIDC_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${WATCH_COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_SECURE: 'true'
      OAUTH2_PROXY_COOKIE_NAME: _agentloom_watch
      OAUTH2_PROXY_REDIRECT_URL: https://agentloom-watch.corp.darkcompute.io/oauth2/callback
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: http://10.231.70.20:8080
      OAUTH2_PROXY_EMAIL_DOMAINS: '*'
      OAUTH2_PROXY_SCOPE: openid email profile
      OAUTH2_PROXY_OIDC_GROUPS_CLAIM: groups
      OAUTH2_PROXY_ALLOWED_GROUPS: authentik Admins
      OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL: 'true'
      OAUTH2_PROXY_PASS_USER_HEADERS: 'true'
      OAUTH2_PROXY_REVERSE_PROXY: 'true'
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: 'true'
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_SESSION_COOKIE_MINIMAL: 'true'
    networks:
      watch:
        ipv4_address: 10.231.70.10
volumes:
  pgdata: null
  appdata: null
  webassets: null
  giteadata: null
  giteaconfig: null
  watchdata: null
networks:
  app: null
  data:
    internal: true
  watch:
    ipam:
      config:
      - subnet: 10.231.70.0/24
