    volumes:
    - appdata:/data
    networks:
    - app
    - data
    depends_on:
      postgres:
        condition: service_healthy
      data-init:
        condition: service_completed_successfully
      supervisor:
        condition: service_healthy
      api:
        condition: service_healthy
    pull_policy: always
  web:
    image: 127.0.0.1:5000/agentloom-app:agentloom
    restart: unless-stopped
    working_dir: /app/apps/web
    command:
    - node_modules/.bin/vite
    - preview
    - --host
    - 0.0.0.0
    - --port
    - '5173'
    volumes:
    - webassets:/app/apps/web/asset-archive
    init: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    pids_limit: 128
    mem_limit: 512m
    environment:
      NODE_ENV: production
      RAYON_NUM_THREADS: '4'
      API_PROXY_TARGET: http://api:3100
      RAKAZO_HOST: agentloom.corp.darkcompute.io
      RAKAZO_IMAGE_TAG: v0.3.6
      SCREEN_PROXY_SECRET: ${SCREEN_PROXY_SECRET}
      RAKAZO_CSP_SCRIPT_SRC: https://a.darkcompute.io
      RAKAZO_CSP_CONNECT_SRC: https://a.darkcompute.io
    networks:
    - app
    depends_on:
      api:
        condition: service_healthy
    pull_policy: always
    ports:
    - 80:5173
  watch-init:
    image: agentloom-watch:local
    build:
      context: ./admin
    pull_policy: build
    command:
    - python3
    - /app/watch.py
    - init
    restart: 'no'
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      WATCH_DB_PASSWORD: ${WATCH_DB_PASSWORD}
    networks:
    - data
    depends_on:
      api:
        condition: service_healthy
  watch:
    image: agentloom-watch:local
    build:
      context: ./admin
    pull_policy: build
    restart: unless-stopped
    read_only: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    mem_limit: 128m
    environment:
      WATCH_DB_PASSWORD: ${WATCH_DB_PASSWORD}
      WATCH_ORIGIN: https://agentloom.corp.darkcompute.io
      WATCH_INSTANCE: AgentLoom CORP
      WATCH_DEFAULT_PLAN: internal
      TRUSTED_PROXY: 10.231.70.10
    volumes:
    - watchdata:/data
    networks:
      data: {}
      watch:
        ipv4_address: 10.231.70.20
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      watch-init:
        condition: service_completed_successfully
  watch-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_PROVIDER_DISPLAY_NAME: authentik
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://auth.darkcompute.io/application/o/darkcompute-agentloom-watch/
      OAUTH2_PROXY_CLIENT_ID: ${WATCH_OIDC_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${WATCH_OIDC_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${WATCH_COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_SECURE: 'true'
      OAUTH2_PROXY_COOKIE_NAME: _agentloom_watch
      OAUTH2_PROXY_REDIRECT_URL: https://agentloom.corp.darkcompute.io/admin/oauth2/callback
      OAUTH2_PROXY_PROXY_PREFIX: /admin/oauth2
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: http://10.231.70.20:8080
      OAUTH2_PROXY_EMAIL_DOMAINS: '*'
      OAUTH2_PROXY_SCOPE: openid email profile
      OAUTH2_PROXY_OIDC_GROUPS_CLAIM: groups
      OAUTH2_PROXY_ALLOWED_GROUPS: authentik Admins
      OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL: 'true'
      OAUTH2_PROXY_PASS_USER_HEADERS: 'true'
      OAUTH2_PROXY_REVERSE_PROXY: 'true'
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: 'true'
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_SESSION_COOKIE_MINIMAL: 'true'
    networks:
      watch:
        ipv4_address: 10.231.70.10
    ports:
    - 8091:4180
volumes:
  pgdata: null
  appdata: null
  webassets: null
  watchdata: null
networks:
  app: null
  data:
    internal: true
  watch:
    ipam:
      config:
      - subnet: 10.231.70.0/24
