# agentloom.corp's own apps: a titled section at the top of Integrations, ending in
# "Request a connector". gen-compose.py writes this into the compose as AGENTLOOM_REGISTRY
# (packages/core/src/agentloom-registry.ts reads it).
#
# Each app's /api/mcp takes the member's own authentik token (provider agentloom-mcp), so a
# bot can do only what that person can. Before an app is listed it vendors darkcompute
# agentkit >= 0.3.0 person.mjs and sets MCP_OIDC_ISSUER/_AUDIENCE/_GROUPS.
# askWrites: every tool not declared read-only asks a person, Just go included.
#
# Keys are closed sets - top: title, request_url, apps; an app: id, name, description,
# endpoint, open, icon, askWrites. gen-compose.py stops on anything else.
title: Darkcompute apps
# "Request a connector" lands in Tasks' triage; the dct_ token is in Coolify as
# AGENTLOOM_CONNECTOR_REQUEST_TOKEN. Unset: no button.
request_url: https://tasks.corp.darkcompute.io/api/capture
# Team spaces (apps/api/src/agentloom-teams.ts): one organization, one space per authentik
# group, kept in step on every registry sweep from each member's own token - join the group,
# get the space; leave it, leave the space (what you made passes to the owner). The groups
# are darkcompute security/access/teams.yaml's. Everyone keeps their Personal space too.
# The owner owns every team space (rename, delete); the org role stays member for all.
teams:
  org: {name: Darkcompute, slug: darkcompute}
  owner: james@darkcompute.io
  # A bot may ask a bot in the same person's other spaces, which does the work with its own apps
  # and approvals. On for everyone; a person listed here is walled into each space.
  crossSpaceOff: []
  spaces:
    - {id: everyone, name: Darkcompute, group: Employees, default: true}
    - {id: admin, name: Admin, group: team-admin}
    - {id: marketing, name: Marketing, group: team-marketing}
    - {id: plccode, name: PLCcode, group: team-plccode}
    - {id: development, name: Development, group: team-development}
    - {id: fleet, name: Fleet, group: team-fleet}
# The approval policy, approved by the owner 2026-11-05. A bot works alone on what is not named
# here: reads, drafts, filing its own work, tasks and branches. An app's tier and destructive
# flags do not reach this gate, only readOnly does, so a tool that must ask is named here.
# never: only a person's own message can start it, and that person approves it each time. A
#   routine or another bot is refused, so a bot's "yes" can never stand in for a person's.
# ask: a person approves it in every mode, whoever started the run. askWrites on an app does the
#   same for everything that app can change.
policy:
  never:
    # moving money and committing to it
    - mcp__dc-books__record_payment
    - mcp__dc-books__approve_payroll
    - mcp__dc-books__void_*
    - mcp__dc-books__match_bill_payments
    - mcp__dc-books__match_deposits
    - mcp__dc-timesheets__void_invoice
    - mcp__dc-timesheets__mark_invoice_paid
    - mcp__dc-books__approve_person_invoice
    - mcp__dc-timesheets__issue_invoice*
    - mcp__dc-timesheets__discard_invoice_draft
    - mcp__dc-portal__timesheets_sendInvoice
    # deleting
    - mcp__dc-*__*delete*
    - mcp__dc-drive__trash
    - mcp__dc-drive__empty_trash
    - mcp__dc-inbox__trash_message
    - mcp__dc-books__remove_*
    - mcp__dc-test__set_irreversible
    - mcp__dc-tasks__remove_*
    - mcp__dc-marketing__remove_series
    - mcp__dc-calendar__archive_calendar
    # granting access
    - mcp__dc-drive__set_space_access
    - mcp__dc-identity__ak_create_user
    - mcp__dc-identity__ak_group_member
    - mcp__dc-identity__ak_recovery_link
    - mcp__dc-identity__ak_set_active
    - mcp__dc-network__netbird_add_policy
    - mcp__dc-network__netbird_update_policy
    - mcp__dc-network__netbird_set_peer_groups
    - mcp__dc-network__netbird_create_setup_key
    - mcp__dc-mail__assign_mailbox
    - mcp__dc-mail__add_group_member
    - mcp__dc-mail__create_mailbox
    - mcp__dc-marketing__add_user
    - mcp__dc-marketing__update_user_access
    - mcp__dc-spaces__add_member
    - mcp__dc-calendar__share_calendar
    - mcp__dc-portal__drive_share_shareWith
    - mcp__dc-tasks__make_token
    - mcp__dc-code__mint_cli_token
    - mcp__dc-test__share_sign_in
    - mcp__dc-spaces__remove_member
    - mcp__dc-tasks__revoke_token
    - mcp__dc-code__revoke_cli_token
    - mcp__dc-inbox__connect_mailbox
    - mcp__dc-inbox__disconnect_mailbox
    - mcp__dc-inbox__enable_sending
    # powering a node off or on
    - mcp__dc-fleet__queue_destructive_action
  ask:
    # what others feel: mail, posts and merges (DNS and deploys are askWrites already)
    - mcp__dc-inbox__send_mail
    - mcp__dc-inbox__reply
    - mcp__dc-inbox__forward_message
    - mcp__dc-calendar__create_event
    - mcp__dc-calendar__update_event
    - mcp__dc-calendar__cancel_event
    - mcp__dc-calendar__resend_invitations
    - mcp__dc-calendar__retry_mail
    - mcp__dc-mail__test_send
    - mcp__dc-portal__chat_sendMessage
    - mcp__dc-marketing__update_engine_settings
    - mcp__dc-marketing__*approve*
    - mcp__dc-marketing__*publish*
    - mcp__dc-recorder__set_published
    - mcp__dc-research__publish
    - mcp__dc-*__*merge*
    - mcp__dc-drive__share_link
    - mcp__dc-spaces__share_chat
    - mcp__dc-tasks__reject_triage_many
    - mcp__dc-books__issue_document
    - mcp__dc-books__approve_week
    - mcp__dc-timesheets__approve_sheet
    # books and pay that a person signs off, and who gets paid
    - mcp__dc-books__add_book
    - mcp__dc-books__set_book
    - mcp__dc-books__apply_rules
    - mcp__dc-books__import_statement
    - mcp__dc-timesheets__add_person
    - mcp__dc-timesheets__set_person
    - mcp__dc-timesheets__set_payer
    - mcp__dc-timesheets__lock_invoice
    - mcp__dc-timesheets__unlock_invoice
    - mcp__dc-timesheets__mark_billed
    - mcp__dc-timesheets__unmark_billed
    # what goes out, when, from which account, and how much the nightly engine makes
    - mcp__dc-marketing__autoschedule_on_deck
    - mcp__dc-marketing__set_post_times
    - mcp__dc-marketing__set_post_accounts
    - mcp__dc-marketing__use_postiz_channel
    - mcp__dc-marketing__replace_posts
    - mcp__dc-marketing__skip_posts
    - mcp__dc-marketing__create_share_link
    - mcp__dc-marketing__evolution_reject
    - mcp__dc-marketing__set_weekly_plan
    - mcp__dc-marketing__update_agent_settings
    - mcp__dc-marketing__update_autopilot_settings
    # a deploy, lost work, and commands a guest will run
    - mcp__dc-code__deploy
    - mcp__dc-code__discard_file
    - mcp__dc-code__remove_worktree
    - mcp__dc-code__set_app_command
    - mcp__dc-code__set_setup_script
    # other people's calendars, sign-ins and shared work
    - mcp__dc-calendar__rsvp
    - mcp__dc-calendar__rotate_feed
    - mcp__dc-viral__sign_in_account
    - mcp__dc-viral__archive_account
    - mcp__dc-viral__archive_source
    - mcp__dc-spaces__accept_all_sources
    - mcp__dc-spaces__chats_bulk
    - mcp__dc-spaces__unshare_chat
    - mcp__dc-flows__save_account
    - mcp__dc-flows__save_env
    - mcp__dc-flows__save_schedule
    - mcp__dc-tasks__confirm_all_p3
    - mcp__dc-inbox__mark_folder_read
    - mcp__dc-recorder__set_archived
