# AgentLoom for customers, published at https://app.agentloom.com through its own Cloudflare
# tunnel, whose cloudflared runs here and reaches web:5173. No port is
# published on the host.
#
# Built from this repository: app-base is upstream's infra/compose/Dockerfile,
# unchanged; agentloom/Dockerfile puts the AgentLoom name on it; api, worker
# and web all run that one image.
#
# Generated by agentloom/gen-compose.py from infra/compose/docker-compose.images.yml
# (upstream v0.3.5). Regenerate after every merge from upstream; never hand-edit.
name: rakazo
services:
  app-base:
    build:
      context: ..
      dockerfile: infra/compose/Dockerfile
      args:
        GIT_SHA: v0.3.5
    image: agentloom-app-base:local
    command:
    - 'true'
    network_mode: none
    restart: 'no'
  postgres:
    image: postgres:16@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    pids_limit: 200
    mem_limit: 2g
    environment:
      POSTGRES_USER: rakazo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rakazo
    volumes:
    - pgdata:/var/lib/postgresql/data
    networks:
    - data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U rakazo -d rakazo
      interval: 5s
      timeout: 5s
      retries: 20
  data-init:
    image: busybox:1
    command:
    - chown
    - -R
    - 1000:1000
    - /data
    network_mode: none
    restart: 'no'
    volumes:
    - appdata:/data
  api:
    image: agentloom-app:local
    restart: unless-stopped
    working_dir: /app/apps/api
    command:
    - bash
    - -lc
    - pnpm db:deploy && exec env -u DATABASE_MIGRATION_URL node --enable-source-maps dist/index.js
    init: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    pids_limit: 256
    mem_limit: 1536m
    extra_hosts:
    - host.docker.internal:host-gateway
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://rakazo_app:${POSTGRES_APP_PASSWORD}@postgres:5432/rakazo
      DATA_DIR: /data
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CONTENT_ENCRYPTION: 'on'
      WAKEUP_DRIVER: graphile
      AGENT_RUNTIME: pi
      API_URL: https://app.agentloom.com
      SECRET_STORE: encrypted
      INFISICAL_ALLOW_INSECURE_HTTP: 'false'
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      SANDBOX_PROVIDER: e2b
      SANDBOX_SUPERVISOR_TOKEN: ${SANDBOX_SUPERVISOR_TOKEN}
      E2B_API_KEY: ${E2B_API_KEY}
      CLOUD_AGENT_PROVIDER: none
      DATABASE_MIGRATION_URL: postgres://rakazo:${POSTGRES_PASSWORD}@postgres:5432/rakazo
      API_HOST: 0.0.0.0
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: https://app.agentloom.com
      WEB_ORIGIN: https://app.agentloom.com
      AUTH_PASSWORD_ENABLED: 'true'
      AUTH_BREACHED_PASSWORD_CHECK_ENABLED: 'true'
      OIDC_NAME: SSO
      OIDC_SCOPES: openid email profile
      OIDC_ALLOW_SIGNUP_BYPASS: 'false'
      SIGNUPS_ENABLED: 'true'
      SCREEN_PROXY_SECRET: ${SCREEN_PROXY_SECRET}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER}
      EMAIL_API_KEY: ${EMAIL_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
    volumes:
    - appdata:/data
    networks:
    - app
    - data
    depends_on:
      postgres:
        condition: service_healthy
      data-init:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 20
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        base: service:app-base
    pull_policy: build
  worker:
    image: agentloom-app:local
    restart: unless-stopped
    working_dir: /app/apps/worker
    command:
    - node
    - --enable-source-maps
    - dist/index.js
    healthcheck:
      test:
      - CMD
      - node
      - dist/health-check.js
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 2m
    init: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    pids_limit: 512
    mem_limit: 2g
    extra_hosts:
    - host.docker.internal:host-gateway
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://rakazo_app:${POSTGRES_APP_PASSWORD}@postgres:5432/rakazo
      DATA_DIR: /data
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CONTENT_ENCRYPTION: 'on'
      WAKEUP_DRIVER: graphile
      AGENT_RUNTIME: pi
      API_URL: https://app.agentloom.com
      SECRET_STORE: encrypted
      INFISICAL_ALLOW_INSECURE_HTTP: 'false'
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      SANDBOX_PROVIDER: e2b
      SANDBOX_SUPERVISOR_TOKEN: ${SANDBOX_SUPERVISOR_TOKEN}
      E2B_API_KEY: ${E2B_API_KEY}
      CLOUD_AGENT_PROVIDER: none
    volumes:
    - appdata:/data
    networks:
    - app
    - data
    depends_on:
      postgres:
        condition: service_healthy
      data-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    pull_policy: never
  web:
    image: agentloom-app:local
    restart: unless-stopped
    working_dir: /app/apps/web
    command:
    - node_modules/.bin/vite
    - preview
    - --host
    - 0.0.0.0
    - --port
    - '5173'
    volumes:
    - webassets:/app/apps/web/asset-archive
    init: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    pids_limit: 128
    mem_limit: 512m
    environment:
      NODE_ENV: production
      API_PROXY_TARGET: http://api:3100
      RAKAZO_HOST: app.agentloom.com
      RAKAZO_IMAGE_TAG: v0.3.5
      SCREEN_PROXY_SECRET: ${SCREEN_PROXY_SECRET}
    networks:
    - app
    depends_on:
      api:
        condition: service_healthy
    pull_policy: never
  cloudflared:
    image: cloudflare/cloudflared:2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    restart: unless-stopped
    command:
    - tunnel
    - --no-autoupdate
    - run
    networks:
    - app
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
    - web
volumes:
  pgdata: null
  appdata: null
  webassets: null
networks:
  app: null
  data:
    internal: true
